<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hospital Management System — Manage appointments, billing, doctors, and patients with an intuitive dashboard.">
    <title>NiiDalo HMS — Hospital Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ===== LOGIN PAGE ===== -->
    <section id="loginPage">
        <div class="login-bg"></div>
        <div class="login-card tilt-card">
            <div class="login-logo tilt-card-inner">
                <img src="OIP.webp" alt=" ECG Heartbeat" class="login-hero-img" />
                <h1 class="text-shimmer">NiiDalo HMS</h1>
                <p>Hospital Management System</p>
            </div>

            <div id="loginError" class="login-error">
                Invalid username or password.
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username"
                        required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password"
                        required>
                </div>
                <div class="form-group">
                    <label for="loginRole">Login As</label>
                    <select id="loginRole" class="form-control" required>
                        <option value="">Select your role</option>
                        <option value="admin">Admin</option>
                        <option value="doctor">Doctor</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block glow-effect magnetic" id="loginBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" />
                    </svg>
                    Sign In
                </button>
            </form>
        </div>


    </section>

    <!-- ===== APP SHELL ===== -->
    <div id="app" class="hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="s-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                </div>
                <div class="s-info">
                    <h2>NiiDalo HMS</h2>
                    <span>Hospital System</span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Populated by JS -->
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="sidebarUser">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div class="user-info">
                        <div class="name" id="userName"></div>
                        <div class="role" id="userRole"></div>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="menu-toggle" id="menuToggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18" />
                        </svg>
                    </button>
                    <h1 class="page-title" id="pageTitle">Dashboard</h1>
                </div>
                <div class="top-bar-right">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <path d="M21 21l-4.35-4.35" />
                        </svg>
                        <input type="text" id="globalSearch" placeholder="Search...">
                    </div>
                </div>
            </header>

            <div class="content-area" id="contentArea">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBox">
            <div class="modal-header">
                <h2 id="modalTitle">Modal</h2>
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- ===== TOASTS ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>

</html>
